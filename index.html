<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Turn a video clip into a volume: time becomes the third axis." />
    <link rel="icon" href="data:," />
    <title>FRAME / SPACE — video as volume</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="meta">
        <span>Video as volume</span>
        <span id="frame-count">—</span>
      </header>

      <h1>Outside / inside.</h1>
      <p class="caption">Source / <span id="source-name">sample.mp4</span></p>

      <div class="stage split" id="stage">
        <canvas id="canvas"></canvas>
        <span class="tag tag-top">01 / The volume</span>
        <span class="tag tag-bottom">02 / Through the volume</span>
      </div>

      <div class="player">
        <button id="play" class="play" type="button" aria-label="Play"><span class="icon"></span></button>
        <input id="cut" type="range" min="2" max="1000" step="1" value="1000" aria-label="Playback position" />
        <output id="cut-value" for="cut">ALL</output>
      </div>

      <div class="controls">
        <div class="control">
          <div class="control-head"><label for="spacing">Frame spacing</label><output id="spacing-value" for="spacing">0.000</output></div>
          <input id="spacing" type="range" min="0.3" max="2.6" step="0.01" value="1.05" />
        </div>
        <div class="control">
          <div class="control-head"><label for="rotation">Rotation</label><output id="rotation-value" for="rotation">0.0°</output></div>
          <input id="rotation" type="range" min="-180" max="180" step="0.1" value="-26" />
        </div>
        <div class="control">
          <div class="control-head"><label for="opacity">Opacity</label><output id="opacity-value" for="opacity">24%</output></div>
          <input id="opacity" type="range" min="2" max="100" step="1" value="24" />
        </div>
        <div class="control">
          <div class="control-head"><label for="roll">Roll time</label><output id="roll-value" for="roll">FLAT</output></div>
          <input id="roll" type="range" min="0" max="100" step="0.5" value="0" />
        </div>
        <div class="control">
          <div class="control-head"><label for="blur">Blur</label><output id="blur-value" for="blur">40%</output></div>
          <input id="blur" type="range" min="0" max="100" step="1" value="40" />
        </div>
        <div class="control">
          <div class="control-head"><label for="layers">Layers</label><output id="layers-value" for="layers">OFF</output></div>
          <input id="layers" type="range" min="0" max="100" step="1" value="0" />
        </div>
        <div class="control control-wide">
          <div class="control-head"><span>View / shape / cut axis</span></div>
          <div class="segments">
            <span class="segment" id="mode"><button type="button" class="on" data-value="0">Volume</button><button type="button" data-value="1">Solid</button></span>
            <span class="segment" id="shape"><button type="button" class="on" data-value="0">Box</button><button type="button" data-value="1">Lens</button><button type="button" data-value="2">Circle</button></span>
            <span class="segment" id="axis"><button type="button" data-value="0">X</button><button type="button" data-value="1">Y</button><button type="button" class="on" data-value="2">T</button></span>
          </div>
        </div>
      </div>

      <footer class="meta">
        <span>Code study / <span id="status">LOADING</span></span>
        <span class="actions">
          <label class="link" for="file-input">Open video<input id="file-input" type="file" accept="video/*" /></label>
          <button class="link" id="split" type="button">Single view</button>
          <button class="link" id="snapshot" type="button">Still</button>
          <button class="link" id="export" type="button">Record turn</button>
        </span>
      </footer>
    </div>

    <video id="video" playsinline muted crossorigin="anonymous" preload="auto" src="./public/sample.mp4"></video>
    <script type="module" src="./app.js"></script>
  </body>
</html>
